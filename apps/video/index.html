<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vídeo · LNUX</title>
  <meta name="description" content="Editor de vídeo no navegador: linha do tempo, cor, transições, títulos, legendas e exportação.">
  <link rel="stylesheet" href="../../comum/lnux.css">
  <link rel="stylesheet" href="video.css">
</head>
<body>
  <div class="lnux-app">
    <header class="lnux-topo">
      <a class="lnux-marca" href="../../" title="Todos os apps"><span id="marca-icone"></span>Vídeo</a>
      <nav class="lnux-menubar" aria-label="Menus"></nav>
      <div class="lnux-titulo-doc" id="titulo-doc">Projeto sem nome</div>
      <div class="lnux-topo-acoes"></div>
    </header>

    <div class="area-cima" id="area-cima">
      <aside class="lnux-painel midias" id="painel-midias" aria-label="Mídias">
        <div class="lnux-painel-cabeca">Mídias<span class="espaco"></span>
          <button class="lnux-botao pequeno" id="botao-importar" type="button">Importar</button>
          <button class="lnux-botao pequeno" id="botao-texto" type="button" title="Novo título (T)">+ Texto</button>
        </div>
        <div class="lnux-painel-corpo lista-midias" id="lista-midias"></div>
      </aside>
      <div class="lnux-divisor" data-divisor="vertical" data-alvo="#painel-midias" data-min="170" data-max="480"></div>

      <section class="lnux-painel monitor" aria-label="Monitor">
        <div class="tela" id="tela">
          <canvas id="quadro" width="1280" height="720" aria-label="Imagem do vídeo"></canvas>
        </div>
        <div class="controles" id="controles">
          <span id="botoes-transporte"></span>
          <span class="mono tempo" id="tempo">00:00:00:00</span>
          <span class="mono fraco" id="duracao">/ 00:00:00:00</span>
          <span class="espaco"></span>
          <label class="lnux-alternar" title="Mostrar as áreas seguras"><input type="checkbox" id="guias"> Guias</label>
        </div>
      </section>

      <div class="lnux-divisor" data-divisor="vertical" data-alvo="#propriedades" data-lado="depois" data-min="230" data-max="520"></div>
      <aside class="lnux-painel propriedades" id="propriedades" aria-label="Propriedades">
        <div class="lnux-painel-cabeca" id="titulo-propriedades">Propriedades</div>
        <div class="lnux-painel-corpo" id="corpo-propriedades"></div>
      </aside>
    </div>

    <div class="abas-celular lnux-abas" id="abas-celular" role="tablist">
      <button type="button" data-aba="linha" aria-selected="true">Linha do tempo</button>
      <button type="button" data-aba="midias" aria-selected="false">Mídias</button>
      <button type="button" data-aba="propriedades" aria-selected="false">Propriedades</button>
    </div>

    <div class="lnux-divisor" data-divisor="horizontal" data-alvo="#linha-do-tempo" data-lado="depois" data-min="140" data-max="640" id="divisor-linha"></div>
    <section class="lnux-painel linha-do-tempo" id="linha-do-tempo" aria-label="Linha do tempo">
      <div class="lnux-ferramentas barra-linha">
        <span id="botoes-edicao"></span>
        <span class="espaco"></span>
        <span id="botoes-zoom"></span>
      </div>
      <div class="editor">
        <div class="canto"></div>
        <canvas id="regua" class="regua"></canvas>
        <div class="cabecalhos" id="cabecalhos"></div>
        <div class="rolagem" id="rolagem" tabindex="0" aria-label="Clipes">
          <div class="espaco-rolagem" id="espaco"></div>
          <canvas id="pistas" class="pistas"></canvas>
        </div>
      </div>
    </section>
  </div>

  <script src="../../comum/lnux.js"></script>
  <script src="../../comum/zip.js"></script>
  <script src="motor.js"></script>
  <script src="video.js"></script>
</body>
</html>
