<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Efeitos · LNUX</title>
  <meta name="description" content="Animação de títulos e gráficos no navegador: camadas, quadros-chave, animações prontas e exportação em vídeo, GIF e PNG.">
  <link rel="stylesheet" href="../../comum/lnux.css">
  <link rel="stylesheet" href="efeitos.css">
</head>
<body>
  <div class="lnux-app">
    <header class="lnux-topo">
      <a class="lnux-marca" href="../../" title="Todos os apps"><span id="marca-icone"></span>Efeitos</a>
      <nav class="lnux-menubar" aria-label="Menus"></nav>
      <div class="lnux-titulo-doc" id="titulo-doc">Composição sem nome</div>
      <div class="lnux-topo-acoes"></div>
    </header>

    <div class="lnux-ferramentas" id="ferramentas" role="toolbar" aria-label="Criar camadas">
      <span id="botoes-criar"></span>
      <span class="sep"></span>
      <button class="lnux-botao pequeno" id="botao-prontas" type="button">Animações prontas ▾</button>
      <button class="lnux-botao pequeno" id="botao-modelos" type="button">Modelos ▾</button>
      <span class="espaco"></span>
      <button class="lnux-botao pequeno primario" id="botao-exportar" type="button">Exportar</button>
    </div>

    <div class="area" id="area">
      <section class="lnux-painel visor" aria-label="Visor">
        <div class="palco" id="palco">
          <div class="quadros">
            <canvas id="quadro" width="1280" height="720" aria-label="Composição"></canvas>
            <canvas id="alcas" width="1280" height="720" aria-hidden="true"></canvas>
          </div>
        </div>
        <div class="controles">
          <span id="botoes-transporte"></span>
          <span class="mono tempo" id="tempo">0:00.00</span>
          <span class="mono fraco" id="duracao">/ 0:06.00</span>
          <span class="espaco"></span>
          <label class="lnux-alternar" title="Repetir sem parar"><input type="checkbox" id="repetir" checked> Repetir</label>
        </div>
      </section>
      <div class="lnux-divisor" data-divisor="vertical" data-alvo="#propriedades" data-lado="depois" data-min="250" data-max="520"></div>
      <aside class="lnux-painel propriedades" id="propriedades" aria-label="Propriedades">
        <div class="lnux-painel-cabeca" id="titulo-propriedades">Composição</div>
        <div class="lnux-painel-corpo" id="corpo-propriedades"></div>
      </aside>
    </div>

    <div class="abas-celular lnux-abas" id="abas-celular" role="tablist">
      <button type="button" data-aba="linha" aria-selected="true">Camadas</button>
      <button type="button" data-aba="propriedades" aria-selected="false">Propriedades</button>
    </div>

    <div class="lnux-divisor" data-divisor="horizontal" data-alvo="#linha" data-lado="depois" data-min="120" data-max="600" id="divisor-linha"></div>
    <section class="lnux-painel linha" id="linha" aria-label="Camadas e quadros-chave">
      <div class="linha-grade">
        <div class="linha-topo-nomes"><span>Camadas</span><span class="espaco"></span><span class="fraco" id="contagem"></span></div>
        <div class="linha-regua-caixa" id="caixa-regua"><canvas id="regua"></canvas></div>
        <div class="linha-nomes" id="nomes"></div>
        <div class="linha-faixas" id="faixas" tabindex="0"><div class="faixas-conteudo" id="faixas-conteudo"></div><div class="cabecote" id="cabecote"></div></div>
      </div>
    </section>
  </div>

  <script src="../../comum/lnux.js"></script>
  <script src="../../comum/zip.js"></script>
  <script src="../../comum/gif.js"></script>
  <script src="motor.js"></script>
  <script src="efeitos.js"></script>
</body>
</html>
